<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="svgRibbon1" x1="15" y1="20" x2="105" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="28%" stop-color="#0072FF" />
      <stop offset="65%" stop-color="#7D2AE8" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="svgRibbon2" x1="85" y1="30" x2="35" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="40%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#7D2AE8" />
    </linearGradient>
    <linearGradient id="svgStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="svgText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7D2AE8" />
      <stop offset="50%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7D2AE8" flood-opacity="0.3" />
    </filter>
  </defs>

  {/* Ribbon 'C' Icon */}
  <g transform="translate(10, 0)">
    <g filter="url(#svgGlow)">
      <path
        d="M 78 30 C 70 16, 52 11, 37 18 C 19 26, 12 47, 18 64 C 25 81, 46 86, 63 82 C 74 79, 82 69, 84 61 C 84 56, 78 54, 75 58 C 68 66, 58 70, 47 69 C 34 66, 27 54, 29 42 C 32 30, 43 22, 55 24 C 63 26, 69 30, 73 37 C 75 41, 81 38, 78 30 Z"
        fill="url(#svgRibbon1)"
      />
      <path
        d="M 55 24 C 43 22, 32 30, 29 42 C 27 54, 34 66, 47 69 C 53 70, 60 67, 66 62 C 69 59, 73 63, 70 67 C 62 75, 50 78, 39 74 C 24 70, 17 54, 20 40 C 23 26, 38 16, 53 18 C 62 18, 70 23, 75 30 C 78 34, 73 37, 71 34 C 67 30, 61 25, 55 24 Z"
        fill="url(#svgRibbon2)"
        opacity="0.85"
      />
    </g>
    {/* 4-Point Sparkle Star */}
    <g transform="translate(72, 14)">
      <path
        d="M 10 0 C 10 5, 13 8, 18 10 C 13 12, 10 15, 10 20 C 10 15, 7 12, 2 10 C 7 8, 10 5, 10 0 Z"
        fill="url(#svgStar)"
      />
    </g>
  </g>

  {/* Typography: Creativa */}
  <text x="120" y="58" font-family="system-ui, -apple-system, 'Inter', 'Montserrat', sans-serif" font-size="44" font-weight="900" fill="url(#svgText)" letter-spacing="-1">
    Creativa
  </text>

  {/* Tagline: Design Without Limits */}
  <text x="122" y="78" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="3">
    DESIGN WITHOUT LIMITS
  </text>
</svg>
